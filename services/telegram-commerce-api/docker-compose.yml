services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://telegram_commerce:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/telegram_commerce
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - commerce_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://telegram_commerce:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/telegram_commerce
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    volumes:
      - commerce_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_commerce
      POSTGRES_USER: telegram_commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_commerce -d telegram_commerce"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  commerce_data:
  postgres_data:

